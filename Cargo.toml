[workspace]
resolver = "2"
members = ["crates/gpui-kit-compat", "crates/router", "crates/router-macros"]
default-members = ["crates/router"]

[workspace.package]
authors = ["迷渡 <justjavac@gmail.com>"]
homepage = "https://github.com/justjavac/gpui-router"
repository = "https://github.com/justjavac/gpui-router"
license = "MIT"
edition = "2024"
readme = "README.md"
publish = false

[workspace.dependencies]
# Path dependencies need an explicit version so `cargo package`/`cargo publish`
# can resolve them from crates.io.
gpui-router = { path = "crates/router", version = "0.4.1" }
gpui-router-macros = { path = "crates/router-macros", version = "0.4.0" }
hashbrown = "0.16.0"
gpui = "0.2.1"
# The explicit `package` rename keeps this dependency's extern name at `gpui_pre`.
# Without it Cargo uses the library name, which is also `gpui` for this crate.
gpui-pre = { package = "gpui-pre", version = "0.3.6" }
proc-macro2 = "1.0.105"
quote = "1.0.43"
smallvec = "1.15.1"
syn = "2.0.110"
