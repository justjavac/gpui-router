name: Build

permissions:
  contents: write
  discussions: write

on:
  push:
    branches: "*"
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/build.yml"
    tags: "*"
  pull_request:
    branches: "*"
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/build.yml"

jobs:
  build:
    name: ${{ matrix.kind }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel # Intel
          - macos-latest # Apple Silicon
          - windows-latest

    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always

    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              gcc g++ clang libfontconfig-dev libwayland-dev \
              libwebkit2gtk-4.1-dev libxkbcommon-x11-dev \
              libx11-xcb-dev libxcb1-dev \
              libssl-dev libzstd-dev \
              vulkan-validationlayers libvulkan1 \
              mold

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      # Caches the cargo registry and the target directory. GPUI dominates the
      # build time, so this keeps the matrix jobs from recompiling it every run.
      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Log versions
        run: |
          rustc --version
          cargo --version

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: cargo check --locked

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Run cargo test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # - name: Publish
      #   if: |
      #     startsWith(matrix.os, 'ubuntu') &&
      #     startsWith(github.repository, 'justjavac') &&
      #     startsWith(github.ref, 'refs/tags/')
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      #   run: |
      #     cargo publish

  # `cargo package` is what refused to run when a path dependency was missing a
  # version requirement, so the release is gated on it instead of finding out at
  # publish time.
  package:
    name: package
    runs-on: ubuntu-latest

    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always

    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              gcc g++ clang libfontconfig-dev libwayland-dev \
              libwebkit2gtk-4.1-dev libxkbcommon-x11-dev \
              libx11-xcb-dev libxcb1-dev \
              libssl-dev libzstd-dev \
              vulkan-validationlayers libvulkan1 \
              mold

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Package gpui-router-macros
        run: cargo package -p gpui-router-macros --locked

      - name: Package gpui-router
        run: cargo package -p gpui-router --locked

  # The workspace declares `rust-version`, so the floor is checked instead of
  # being a claim nobody verifies.
  msrv:
    name: msrv
    runs-on: ubuntu-latest

    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always

    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              gcc g++ clang libfontconfig-dev libwayland-dev \
              libwebkit2gtk-4.1-dev libxkbcommon-x11-dev \
              libx11-xcb-dev libxcb1-dev \
              libssl-dev libzstd-dev \
              vulkan-validationlayers libvulkan1 \
              mold

      - name: Install the minimum supported toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check with the minimum supported toolchain
        run: cargo check -p gpui-router --locked
