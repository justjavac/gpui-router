[package]
name = "gpui-kit-compat"
version = "0.0.0"
description = "Unpublished harness that consumes gpui-router from a gpui-kit application."
edition.workspace = true
publish = false

[dependencies]
gpui-kit = "0.6.6"
gpui-router = { path = "../router", default-features = false, features = ["gpui-pre"] }

[dev-dependencies]
gpui-kit = { version = "0.6.6", features = ["test-support"] }
